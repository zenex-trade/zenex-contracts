[workspace]
resolver = "2"
members = [
  "oracle",
  "strategy-vault",
  "test-suites",
  "market",
  "governance",
  "treasury",
  "factory",
]

[workspace.dependencies.soroban-sdk]
version = "26.1.1"

# Upstream releases only against soroban-sdk 25, which would pin the whole
# workspace to protocol 25. This is our fork of upstream's own p26 branch with
# the released SDK 26 line; drop it for a crates.io version once upstream ships
# a protocol-26 release.
[workspace.dependencies.soroban-fixed-point-math]
git = "https://github.com/zenith-protocols/soroban-fixed-point-math"
rev = "1e9ff78cc16a773deec98d9cf75a5341bf10a221"

[workspace.dependencies.stellar-access]
version = "0.7.2"

[workspace.dependencies.stellar-contract-utils]
version = "0.7.2"

[workspace.dependencies.stellar-macros]
version = "0.7.2"

[workspace.dependencies.stellar-tokens]
version = "0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
