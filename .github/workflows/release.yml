name: Stellar Expert WASM Release

permissions:
  id-token: write
  contents: write
  attestations: write

on:
  push:
    tags:
      - 'v*' # runs when a tag prefixed with "v" is pushed

# Each job builds one contract with stellar-expert/soroban-build-workflow, pinned
# to the v27.0.0 commit, which builds with Stellar CLI 27.0.0. It publishes a
# GitHub release with the optimized WASM and its SHA-256 hash, attests the build
# provenance, and submits the hash to stellar.expert for source validation.
# Deploy the WASMs from these releases.
#
# The build embeds the repository name as the `source_repo` contract meta, so
# the same tag gives other hashes in another repository. The jobs therefore run
# in the public repository only. `make release` rebuilds the same files locally.
jobs:
  release-contract-market:
    if: github.repository == 'zenex-trade/zenex-contracts'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Zenex Market Release'
      package: 'market'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-strategy-vault:
    if: github.repository == 'zenex-trade/zenex-contracts'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Zenex Strategy Vault Release'
      package: 'strategy-vault'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-oracle:
    if: github.repository == 'zenex-trade/zenex-contracts'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Zenex Oracle Release'
      package: 'oracle'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-factory:
    if: github.repository == 'zenex-trade/zenex-contracts'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Zenex Factory Release'
      package: 'factory'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-treasury:
    if: github.repository == 'zenex-trade/zenex-contracts'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Zenex Treasury Release'
      package: 'treasury'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-governance:
    if: github.repository == 'zenex-trade/zenex-contracts'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Zenex Governance Release'
      package: 'governance'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
