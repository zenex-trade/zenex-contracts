# CI for the contract workspace plus the standalone fuzz workspace.
#
# `make test` chains four things: `build` (the release WASMs the tests and the
# fuzz harness embed), `fuzz-check` (type-checks test-suites/fuzz, which is its
# own cargo workspace that `cargo test --all` never compiles),
# `build-upgrade-fixture` (the changed-code WASM the upgrade tests install), and
# the full workspace test suite. Running the whole chain on every pull request is the
# point: an API change that breaks the fuzz workspace must fail the branch that
# made it, not the next release.
#
# A pull request runs once, on its merge commit. A push runs only on main, so a
# pull-request branch does not run twice. Coverage runs on main and on demand:
# it repeats the suite under instrumentation for its report, not as a gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; nothing here writes back through the API.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 27.0.0

jobs:
  # Single required check for branch protection: fails if any job failed or
  # was cancelled, so adding a job never needs a settings change. Coverage is
  # not a gate, so it is not listed.
  complete:
    if: always()
    needs: [fmt, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path test-suites/fuzz/Cargo.toml --all --check
      - run: cargo fmt --manifest-path test-suites/fixtures/upgrade-market/Cargo.toml --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Bound linker memory and disk use across the SDK-heavy test executables.
      # Release WASMs retain the workspace release profile.
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Rustup installs the compiler, target and components from rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            test-suites/fuzz

      # `make build` shells out to `stellar contract build --optimize`; the
      # published release binaries ship with the wasm-opt support that flag
      # needs. Pinned so a CLI release cannot change what CI builds.
      - name: Install stellar-cli
        run: |
          mkdir -p "$HOME/.stellar-cli"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.stellar-cli"
          echo "$HOME/.stellar-cli" >> "$GITHUB_PATH"
          "$HOME/.stellar-cli/stellar" --version

      - name: make test
        run: make test

      - name: Native integration coverage path
        run: cargo test --locked -p test-suites --features native-contracts --lib --tests

      - name: Install bounded fuzz runner
        run: |
          (cd test-suites/fuzz && rustup show active-toolchain)
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Bounded fuzz property smoke
        env:
          FUZZ_SECONDS: 15
          FUZZ_SEED: 109
          FUZZ_RSS_MB: 2048
          CARGO_BUILD_JOBS: 2
        run: make fuzz-smoke

      - name: Retain fuzz seeds, corpora, counters and replay logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-suites/fuzz/campaigns/smoke/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native coverage toolchain
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Cache coverage dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          workspaces: |
            .
      - name: Install stellar-cli
        run: |
          mkdir -p "$HOME/.stellar-cli"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.stellar-cli"
          echo "$HOME/.stellar-cli" >> "$GITHUB_PATH"
          "$HOME/.stellar-cli/stellar" --version
      - name: Execute complete workspace tests and report mixed native coverage
        run: make coverage
      - name: Publish native coverage summary
        run: |
          echo 'Native source coverage includes inline tests; embedded WASM internals are not measured.' >> "$GITHUB_STEP_SUMMARY"
          echo '<pre>' >> "$GITHUB_STEP_SUMMARY"
          cat target/coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '</pre>' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain LLVM reports and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14
